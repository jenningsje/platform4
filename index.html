<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #ffffff;
            color: #202124;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .search-container {
            width: 100%;
            max-width: 584px;
            padding: 0 20px;
            text-align: center;
        }

        .search-form {
            position: relative;
            display: flex;
            align-items: center;
            width: 100%;
            border: 1px solid #dfe1e5;
            border-radius: 24px;
            padding: 0 14px;
            background: #fff;
            box-shadow: none;
            transition: box-shadow 0.2s ease, border-color 0.2s ease;
        }

        .search-form:hover,
        .search-form:focus-within {
            box-shadow: 0 1px 6px rgba(32, 33, 36, 0.28);
            border-color: rgba(223, 225, 229, 0);
        }

        .search-input {
            flex: 1;
            height: 44px;
            border: none;
            outline: none;
            font-size: 16px;
            background: transparent;
            color: #202124;
            padding-left: 12px;
        }

        .search-icon {
            width: 20px;
            height: 20px;
            fill: #9aa0a6;
        }
    </style>
</head>
<body>

    <div class="search-container">
        <form class="search-form" id="searchForm">
            <svg class="search-icon" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"></path>
            </svg>
            <input type="text" name="query" id="searchInput" class="search-input" autofocus autocomplete="off" placeholder="Search...">
        </form>
    </div>

    <script>
        const searchForm = document.getElementById('searchForm');
        const searchInput = document.getElementById('searchInput');

        searchForm.addEventListener('submit', function(e) {
            e.preventDefault();
            
            const queryText = searchInput.value.trim();
            if (!queryText) return;

            const payload = {
                query: queryText
            };
            fetch('/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            })
            .then(response => {
                // Handle your backend response here
                console.log('Successfully sent JSON to backend:', payload);
            })
            .catch(error => {
                console.error('Error sending request:', error);
            });
        });
    </script>

</body>
</html>
