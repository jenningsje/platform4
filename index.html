<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Model Search Dashboard</title>
    <!-- React and ReactDOM CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel Standalone for JSX support -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(rgba(10, 15, 25, 0.75), rgba(10, 15, 25, 0.75)), 
                        url('https://images.unsplash.com/photo-1519501025264-65ba15a82390?q=80&w=1920&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
            color: #202124;
            min-height: 100vh;
            backdrop-filter: blur(6px);
            padding: 40px 20px;
        }

        .main-container {
            max-width: 620px;
            margin: 0 auto;
        }

        .search-container {
            width: 100%;
            margin-bottom: 30px;
            text-align: center;
        }

        .search-form {
            position: relative;
            display: flex;
            align-items: center;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 30px;
            padding: 6px 8px 6px 18px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            transition: all 0.25s ease;
        }

        .search-form:hover,
        .search-form:focus-within {
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
            border-color: rgba(255, 255, 255, 0.6);
        }

        .search-input {
            flex: 1;
            height: 44px;
            border: none;
            outline: none;
            font-size: 16px;
            background: transparent;
            color: #202124;
            padding-right: 12px;
        }

        .search-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .search-icon-btn {
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            transition: background-color 0.2s ease;
        }

        .search-icon-btn:hover {
            background-color: rgba(66, 133, 244, 0.1);
        }

        .search-icon {
            width: 20px;
            height: 20px;
            fill: #5f6368;
            transition: fill 0.2s ease;
        }

        .search-form:hover .search-icon,
        .search-form:focus-within .search-icon {
            fill: #4285f4;
        }
    </style>
</head>
<body>

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function ModelCard({ model }) {
            const {
                name,
                creator,
                platform,
                usage_link,
                citation,
                description,
                capabilities,
                license,
            } = model;

            return (
                <div style={styles.card}>
                    <div style={styles.header}>
                        <h2 style={styles.title}>{name}</h2>
                        {platform && <span style={styles.platform}>{platform}</span>}
                    </div>

                    <p style={styles.creator}>By {creator}</p>
                    <p style={styles.description}>{description}</p>

                    {capabilities && capabilities.length > 0 && (
                        <div style={styles.section}>
                            <h4 style={styles.sectionTitle}>Capabilities</h4>
                            <div style={styles.badgeContainer}>
                                {capabilities.map((cap, index) => (
                                    <span key={index} style={styles.badge}>
                                        {cap}
                                    </span>
                                ))}
                            </div>
                        </div>
                    )}

                    {citation && (
                        <p style={styles.citation}>
                            <strong>Citation:</strong> {citation}
                        </p>
                    )}

                    <div style={styles.footer}>
                        <span style={styles.license}>License: {license || "N/A"}</span>
                        {usage_link && (
                            <a
                                href={usage_link}
                                target="_blank"
                                rel="noopener noreferrer"
                                style={styles.link}
                            >
                                Launch Model &rarr;
                            </a>
                        )}
                    </div>
                </div>
            );
        }

        function ModelCards() {
            const [cards, setCards] = useState([]);

            useEffect(() => {
                const interval = setInterval(async () => {
                    const found = [];

                    for (let i = 1; i <=10; i++) {
                        try {
                            const response = await fetch(`/model_card${i}.json`);

                            if (!response.ok) {
                                break; 
                            }

                            const json = await response.json();
                            found.push(json);

                        } catch (err) {
                            break;
                        }
                    }

                    setCards(found);
                }, 1000);

                return () => clearInterval(interval);
            }, []);

            return (
                <div>
                    {cards.map((card, index) => (
                        <ModelCard key={index} model={card} />
                    ))}
                </div>
            );
        }

        function SearchBar() {
            const [query, setQuery] = useState('');

            const handleSubmit = async (e) => {
                e.preventDefault();
                const trimmedQuery = query.trim();
                if (!trimmedQuery) return;

                const payload = {
                    query: trimmedQuery,
                    timestamp: new Date().toISOString()
                };

                try {
                    const response = await fetch('/', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(payload)
                    });
                    
                    const data = await response.json();
                    console.log('Successfully created and populated /src/search.json:', data);
                    setQuery('');
                } catch (error) {
                    console.error('Error sending request:', error);
                }
            };

            return (
                <div className="search-container">
                    <form className="search-form" onSubmit={handleSubmit}>
                        <input 
                            type="text" 
                            className="search-input" 
                            autoFocus 
                            autoComplete="off" 
                            placeholder="Search..."
                            value={query}
                            onChange={(e) => setQuery(e.target.value)}
                        />
                        <div className="search-actions">
                            <button type="submit" className="search-icon-btn" aria-label="Search">
                                <svg className="search-icon" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                                    <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"></path>
                                </svg>
                            </button>
                        </div>
                    </form>
                </div>
            );
        }

        function App() {
            return (
                <div className="main-container">
                    <SearchBar />
                    <ModelCards />
                </div>
            );
        }

        const styles = {
            card: {
                backgroundColor: "#1a1d24",
                backgroundImage: "linear-gradient(135deg, rgba(255, 255, 255, 0.05) 0%, rgba(0, 0, 0, 0.2) 100%)",
                border: "1px solid rgba(255, 255, 255, 0.1)",
                boxShadow: "0 8px 32px 0 rgba(0, 0, 0, 0.37), inset 0 1px 1px 0 rgba(255, 255, 255, 0.08)",
                borderRadius: "12px",
                padding: "24px",
                color: "#e2e8f0",
                fontFamily: "-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif",
                maxWidth: "480px",
                margin: "16px auto",
                backdropFilter: "blur(4px)",
            },
            header: {
                display: "flex",
                justifyContent: "space-between",
                alignItems: "flex-start",
                marginBottom: "8px",
            },
            title: {
                margin: 0,
                fontSize: "20px",
                fontWeight: "600",
                color: "#f8fafc",
            },
            platform: {
                backgroundColor: "#334155",
                color: "#94a3b8",
                fontSize: "12px",
                padding: "4px 8px",
                borderRadius: "6px",
                textTransform: "uppercase",
                letterSpacing: "0.5px",
            },
            creator: {
                margin: "0 0 12px 0",
                fontSize: "14px",
                color: "#94a3b8",
            },
            description: {
                margin: "0 0 16px 0",
                fontSize: "14px",
                lineHeight: "1.5",
                color: "#cbd5e1",
            },
            section: {
                marginBottom: "16px",
            },
            sectionTitle: {
                margin: "0 0 8px 0",
                fontSize: "12px",
                textTransform: "uppercase",
                letterSpacing: "0.5px",
                color: "#64748b",
            },
            badgeContainer: {
                display: "flex",
                flexWrap: "wrap",
                gap: "6px",
            },
            badge: {
                backgroundColor: "rgba(51, 65, 85, 0.5)",
                border: "1px solid rgba(255, 255, 255, 0.05)",
                color: "#cbd5e1",
                fontSize: "12px",
                padding: "3px 8px",
                borderRadius: "4px",
            },
            citation: {
                margin: "0 0 16px 0",
                fontSize: "12px",
                color: "#64748b",
                fontStyle: "italic",
            },
            footer: {
                display: "flex",
                justifyContent: "space-between",
                alignItems: "center",
                paddingTop: "12px",
                borderTop: "1px solid rgba(255, 255, 255, 0.06)",
                fontSize: "12px",
                color: "#64748b",
            },
            license: {
                textTransform: "uppercase",
                letterSpacing: "0.5px",
            },
            link: {
                backgroundColor: "#3b82f6",
                color: "#ffffff",
                padding: "6px 12px",
                borderRadius: "6px",
                textDecoration: "none",
                fontWeight: "500",
                transition: "background-color 0.2s",
            },
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>

</body>
</html>
