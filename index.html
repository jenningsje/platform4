<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search</title>
    <!-- React and ReactDOM CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel Standalone for JSX support -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(rgba(10, 15, 25, 0.55), rgba(10, 15, 25, 0.55)), 
                        url('https://images.unsplash.com/photo-1519501025264-65ba15a82390?q=80&w=1920&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
            color: #202124;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            backdrop-filter: blur(6px);
        }

        .search-container {
            width: 100%;
            max-width: 620px;
            padding: 0 20px;
            text-align: center;
        }

        .search-form {
            position: relative;
            display: flex;
            align-items: center;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 30px;
            padding: 6px 8px 6px 18px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            transition: all 0.25s ease;
        }

        .search-form:hover,
        .search-form:focus-within {
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
            border-color: rgba(255, 255, 255, 0.6);
        }

        .search-input {
            flex: 1;
            height: 44px;
            border: none;
            outline: none;
            font-size: 16px;
            background: transparent;
            color: #202124;
            padding-right: 12px;
        }

        .search-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .search-icon-btn {
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            transition: background-color 0.2s ease;
        }

        .search-icon-btn:hover {
            background-color: rgba(66, 133, 244, 0.1);
        }

        .search-icon {
            width: 20px;
            height: 20px;
            fill: #5f6368;
            transition: fill 0.2s ease;
        }

        .search-form:hover .search-icon,
        .search-form:focus-within .search-icon {
            fill: #4285f4;
        }
    </style>
</head>
<body>

    <div id="root"></div>

    <script type="text/babel">
        function SearchApp() {
            const [query, setQuery] = React.useState('');

            const handleSubmit = async (e) => {
                e.preventDefault();
                const trimmedQuery = query.trim();
                if (!trimmedQuery) return;

                const payload = {
                    query: trimmedQuery,
                    timestamp: new Date().toISOString()
                };

                try {
                    const response = await fetch('/', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(payload)
                    });
                    
                    const data = await response.json();
                    console.log('Successfully created and populated /src/search.json:', data);
                    setQuery('');
                } catch (error) {
                    console.error('Error sending request:', error);
                }
            };

            return (
                <div className="search-container">
                    <form className="search-form" onSubmit={handleSubmit}>
                        <input 
                            type="text" 
                            className="search-input" 
                            autoFocus 
                            autoComplete="off" 
                            placeholder="Search..."
                            value={query}
                            onChange={(e) => setQuery(e.target.value)}
                        />
                        <div className="search-actions">
                            <button type="submit" className="search-icon-btn" aria-label="Search">
                                <svg className="search-icon" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                                    <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"></path>
                                </svg>
                            </button>
                        </div>
                    </form>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<SearchApp />);
    </script>

</body>
</html>
