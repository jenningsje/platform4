services:
  homepage:
    build: .
    container_name: homepage-app
    ports:
      - "8000:8000"
      - "9000:9000"
      - "9100:9100"
    environment:
      - OLLAMA_HOST=http://host.docker.internal:11434
      - KAGGLE_USERNAME=${KAGGLE_USERNAME}
      - KAGGLE_API_TOKEN=${KAGGLE_API_TOKEN}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped